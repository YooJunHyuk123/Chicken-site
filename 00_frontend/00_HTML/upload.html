{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>치킨 등록</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <header class="container">
        <h1>치킨 사이트</h1>
        <div class="header-actions" id="user-section"></div>
    </header>

    <div class="container">
        <h2>치킨 등록</h2>
        <input type="text" id="image_url" placeholder="이미지 URL" />
        <input type="text" id="brand" placeholder="브랜드" />
        <input type="text" id="style" placeholder="스타일" />
        <input type="text" id="name" placeholder="치킨 이름" />
        <input type="number" id="spiciness" placeholder="맵기" />
        <input type="number" id="sweetness" placeholder="단맛" />
        <input type="number" id="crispiness" placeholder="바삭함" />
        <textarea id="description" placeholder="설명"></textarea>
        <button type="button" class="btn" onclick="createChicken()">등록</button>
    </div>

    <script src="{% static 'script.js' %}"></script>
</body>

</html>
