<!-- upload.html -->

<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>치킨 관리</title>
    <link rel="stylesheet" href="../01_CSS/style.css">
</head>

<body>
    <h1>치킨 관리</h1>

    <h2>치킨 등록</h2>

    <form id="createChickenForm">
        <label>이미지 URL: <input type="text" name="image_url" required></label><br>
        <label>브랜드: <input type="text" name="brand" maxlength="10" required></label><br>
        <label>스타일: <input type="text" name="style" maxlength="10" required></label><br>
        <label>이름: <input type="text" name="name" maxlength="10" required></label><br>
        <label>매운맛(1~5):
            <input type="number" name="spiciness" min="1" max="5" required>
        </label><br>
        <label>단맛(1~5):
            <input type="number" name="sweetness" min="1" max="5" required>
        </label><br>
        <label>바삭함(1~5):
            <input type="number" name="crispiness" min="1" max="5" required>
        </label><br>
        <label>설명: <textarea name="description" required></textarea></label><br>
        <button type="submit">등록</button>
    </form>

    <hr>

    <h2>치킨 수정 / 삭제</h2>

    <label>치킨 ID: <input type="number" id="editChickenId"></label>

    <button onclick="loadChickenInfo()">불러오기</button>

    <div id="editSection" style="display:none;">
        <h3>치킨 수정</h3>
        <form id="updateChickenForm"></form>
        <button onclick="updateChicken()">수정</button>
        <button onclick="deleteChicken()">삭제</button>
    </div>

    <div id="result"></div>

    <script src="../02_JS/script.js"></script>
</body>

</html>
