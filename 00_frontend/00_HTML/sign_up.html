<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <link rel="stylesheet" href="../01_CSS/style.css">
</head>

<body>
    <h1>회원 가입</h1>

    <form id="signupForm">
        <label>아이디: <input type="text" name="username" required></label><br>
        <label>비밀번호: <input type="password" name="password1" required></label><br>
        <label>비밀번호 확인: <input type="password" name="password2" required></label><br>
        <button type="submit">회원 가입</button>
    </form>

    <div id="result"></div>

    <script src="../02_JS/script.js"></script>
</body>

</html>
