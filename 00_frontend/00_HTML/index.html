{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>치킨 목록</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <header class="container">
        <h1>치킨 사이트</h1>
        <div class="header-actions" id="user-section">
            <!-- Buttons handled by JS -->
        </div>
    </header>

    <div class="container">
        <hr>
        <h2>치킨 검색</h2>
        <input type="text" id="searchInput" placeholder="치킨 이름 검색" />
        <button type="button" class="btn" onclick="searchChicken()">검색</button>

        <hr>
        <h2>전체 치킨 목록</h2>
        <div id="chicken-list"></div>
    </div>

    <script src="{% static 'script.js' %}"></script>
</body>

</html>
